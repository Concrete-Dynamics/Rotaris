# Continuous integration — R-079 (docs/product/requests.md#r-079).
#
# Every push to a branch and every pull request runs two jobs on a Windows x64 runner:
#
#   gate     `pnpm deps:audit` — `pnpm audit --prod --audit-level=high` over the production tree, blocking (R-091,
#            docs/architecture/hardening.md §3.5); `pnpm deps:audit:runtime` — the shipped Electron's advisories at high and
#            above, blocking; then `pnpm check` — symbols, typecheck, lint, tests: the commit gate
#            of AGENTS.md; then `pnpm req-coverage`'s summary on the run's page (R-092); then `pnpm test:coverage`, failing
#            below vitest.config.ts's floor, its summary on the run's page and coverage/ uploaded (R-091)
#   package  `pnpm package` — the code-intelligence runtime for win32-x64 (ADR-0035), the native bindings rebuilt and
#            load-proved under the shipped Electron, the installer named by tools/release-naming (REQ-STARTUP-031), and
#            the packaged app launched once against a loopback stub model (ADR-0056 rule 4 (b)); the installer is
#            uploaded as a WORKFLOW ARTIFACT
#
# What this workflow is NOT:
#   - not the tag workflow of docs/architecture/first-release-plan.md §4.2 (`release.yml`, R-080): it never runs on a
#     tag, never runs `pnpm release:guard`, never creates a GitHub release of any kind. A published release is what
#     the in-app updater offers every install (apps/desktop/src/main/updater/feed.ts), so this file holds no write
#     permission at all.
#   - not releasable output: the package is a DEVELOPMENT package (ROTARIS_PACKAGE_WITHOUT_NOTICES=1) while O-3, O-11
#     and OQ-74 keep `pnpm notices` refusing (REQ-STARTUP-037, REQ-STARTUP-143); its About page says it has no notices
#     file. It carries no SHA256SUMS.txt and no signature (REQ-STARTUP-032, REQ-STARTUP-167, O-2).
#   - not REQ-STARTUP-156's release gate: a hosted runner is a build machine with a toolchain and a network.
#   - not a proof runner: R-079 put no proof suite in CI. `pnpm live-run` and `slice-proof` may never run here
#     (AGENTS.md).
#
# One platform key, windows-x64 (PD-STARTUP-001, OQ-400): no arm64 runner, no macOS or Linux job (IC-3).
#
# Hardening for a public repository: third-party actions pinned by full commit SHA (the tag in the comment), the token
# read-only, `pull_request` and never `pull_request_target`, no secret referenced anywhere, checkout without persisted
# credentials, and a superseded run of the same branch or pull request cancelled. tools/workflows.test.ts holds these
# rules for every file in .github/workflows/.
#
# Static analysis is codeql.yml's (R-091), not a job here. The audit's exceptions: a known advisory that has been read is
# excepted by its GHSA id under `auditConfig.ignoreGhsas` in pnpm-workspace.yaml, each entry with a comment naming its
# reading in docs/architecture/dependency-alerts/ — never `--ignore` on this command line, never a silent ignore.
# `--prod` reads `dependencies` alone, and Electron, the runtime the product ships, is a devDependency of
# apps/desktop (electron-builder's convention), as are the build tools; the whole tree is therefore audited too, in a
# step that reports and does not block (docs/architecture/dependency-alerts/2026-11-01-audit-gate.md), and the same
# report is read for Electron alone in a step that blocks (`pnpm deps:audit:runtime`, 2026-11-04; the reading
# docs/architecture/dependency-alerts/2026-11-04-lane-electron-44-10.md).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The tests' git fixtures and electron-builder's caches stay inside the job.
  GIT_TERMINAL_PROMPT: '0'
  ELECTRON_CACHE: ${{ github.workspace }}\.ci-cache\electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.ci-cache\electron-builder

jobs:
  gate:
    name: gate (pnpm check)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Git settings for this tree
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global user.name 'Rotaris CI'
          git config --global user.email 'ci@rotaris.invalid'
          git config --global init.defaultBranch main
          # The hosted runner's TEMP is an 8.3 short name (C:\Users\RUNNER~1\...), and the tests compare the paths the
          # code canonicalises against os.tmpdir()'s spelling (docs/defects/tests-that-compare-a-path-with-os-tmpdir-fail-where-temp-is-an-8-3-short-name.md).
          # RUNNER_TEMP, on the work drive, has no short form.
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No version input: pnpm/action-setup reads `packageManager` from the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # R-091: a production dependency inside a high or critical advisory's range fails the gate. The script is
      # `pnpm audit --prod --audit-level=high` (root package.json); exceptions as the header says.
      - name: Dependency audit (production, high and above)
        run: pnpm deps:audit

      # The shipped runtime the production audit cannot see: Electron is a devDependency (electron-builder's
      # convention), so `--prod` skips it. The whole tree's report, read for the runtime alone
      # (tools/runtime-audit/runtime-audit.mjs); a report it cannot read fails too. Exceptions as the header says.
      - name: Dependency audit (shipped runtime, high and above)
        run: pnpm deps:audit:runtime

      # The whole tree, Electron and the build tools included, for the log and the run's summary only: the report is
      # written to $GITHUB_STEP_SUMMARY, and a red here marks the step and never fails the job.
      - name: Dependency audit (whole tree, report only)
        continue-on-error: true
        shell: pwsh
        run: |
          $report = pnpm audit --audit-level=high 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $report
          "## Dependency audit, whole tree (report only)`n`n``````text`n$report`n``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: Electron runtime
        run: node node_modules/electron/install.js

      # `pnpm lint`'s eslint carries its own heap bound (`--max-old-space-size`, package.json): one type-aware `eslint .`
      # needs about 3.9 GB, and at Node's default limit on this runner it died before the tests ran
      # (docs/archive/defects/the-ci-gates-lint-runs-out-of-javascript-heap-at-nodes-default-heap-limit.md).
      - name: pnpm check
        run: pnpm check

      # The requirement coverage summary on the run's page (R-092, docs/architecture/hardening.md §6): report-only.
      # The ratchet on the uncited, `pnpm req-coverage --check`, already ran inside `pnpm check`'s lint.
      - name: Requirement coverage summary
        shell: pwsh
        run: |
          '## Requirement coverage' >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          '```text' >> $env:GITHUB_STEP_SUMMARY
          pnpm --silent req-coverage >> $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw "pnpm req-coverage exited $LASTEXITCODE" }
          '```' >> $env:GITHUB_STEP_SUMMARY

      # R-091 (hardening.md §3.5 rows 6 and 10): the coverage measurement, outside `pnpm check` (vitest.config.ts says why).
      # It fails the job below the floor vitest.config.ts holds; its text summary, and the floor's misses, go to the run's
      # page, and the lcov report in coverage/ is uploaded beside it. A rise `autoUpdate` writes here is not committed:
      # the floor rises only by a commit that measured it (.claude/rules/tests-and-proofs.md).
      - name: Coverage
        shell: pwsh
        run: |
          pnpm test:coverage *> coverage-run.log
          $code = $LASTEXITCODE
          Get-Content coverage-run.log
          $text = (Get-Content -Raw coverage-run.log) -replace "\x1b\[[0-9;]*m", ''
          $block = [regex]::Match($text, '(?ms)^=+ Coverage summary =+\r?$.*?^=+\r?$').Value
          $misses = [regex]::Matches($text, '(?m)^ERROR: Coverage .*$') | ForEach-Object { $_.Value.TrimEnd() }
          $summary = if ($block) { (@($block) + $misses) -join "`n" } else { 'pnpm test:coverage printed no coverage summary: read the step log.' }
          "## Coverage (pnpm test:coverage)`n`n``````text`n$summary`n``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

  package:
    name: package (windows-x64, development)
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      # R-079: a development package until the notices inputs exist (see the header).
      ROTARIS_PACKAGE_WITHOUT_NOTICES: '1'
    steps:
      - name: Git settings for this tree
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global user.name 'Rotaris CI'
          git config --global user.email 'ci@rotaris.invalid'
          git config --global init.defaultBranch main
          # The hosted runner's TEMP is an 8.3 short name (C:\Users\RUNNER~1\...), and the tests compare the paths the
          # code canonicalises against os.tmpdir()'s spelling (docs/defects/tests-that-compare-a-path-with-os-tmpdir-fail-where-temp-is-an-8-3-short-name.md).
          # RUNNER_TEMP, on the work drive, has no short form.
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `pnpm build-id` reads the commit and the tree's state (REQ-SHELL-140).
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Electron runtime
        run: node node_modules/electron/install.js

      # No `pnpm symbols` step: `pnpm package`'s build writes the git-ignored requirement symbols itself when they are
      # absent, and this job's fresh clone is the check that it does
      # (docs/archive/defects/pnpm-package-on-a-fresh-checkout-fails-for-the-requirement-symbols-it-never-generates.md).

      # The bundle step extracts the pinned uv with the first `tar` on PATH, and Git for Windows' GNU tar cannot read a
      # zip (docs/defects/the-bundle-step-extracts-the-pinned-uv-with-whatever-tar-is-first-on-path.md): say which one
      # this runner resolves, before the step that depends on it.
      - name: Which tar the bundle step will run
        shell: pwsh
        run: |
          Get-Command tar -All | Format-Table -AutoSize Source
          tar --version

      # `pnpm package` builds the same bundle itself and skips it when the marker matches; running it first gives the
      # fetch-heavy step its own line and its own time.
      - name: Code-intelligence runtime (win32-x64)
        run: pnpm code-intel:bundle --target=win32-x64

      # electron-vite build with the seams compiled out, the seam check, electron-builder --win with ADR-0056's hooks,
      # and the packaged app's launch. It writes apps/desktop/release/load-proof.json either way.
      - name: pnpm package
        run: pnpm package

      - name: Name, size and digest of what was produced
        if: success()
        shell: pwsh
        run: |
          $files = Get-ChildItem apps/desktop/release -File -Filter 'Rotaris-*-windows-x64-*.exe'
          if ($files.Count -ne 1) { throw "expected one installer under apps/desktop/release, found $($files.Count)" }
          '| artifact | bytes | sha256 |' >> $env:GITHUB_STEP_SUMMARY
          '|---|---|---|' >> $env:GITHUB_STEP_SUMMARY
          foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "| ``$($f.Name)`` | $($f.Length) | ``$h`` |" >> $env:GITHUB_STEP_SUMMARY
          }
          '' >> $env:GITHUB_STEP_SUMMARY
          'A development package (no notices file), not a release: R-079.' >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the installer
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-development-installer
          path: apps/desktop/release/Rotaris-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload the package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-package-evidence
          path: |
            apps/desktop/release/load-proof.json
            apps/desktop/release/load-proof.afterpack.json
            apps/desktop/release/load-proof.app.log
            apps/desktop/release/load-proof.png
            apps/desktop/release/electron-builder.package.yml
            apps/desktop/resources/code-intelligence/bundle.json
          if-no-files-found: warn
          retention-days: 14
