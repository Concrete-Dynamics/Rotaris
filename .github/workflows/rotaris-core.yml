name: Rotaris engine

on:
  pull_request:
    paths:
      - "src/rotaris_core/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/rotaris-core.yml"
  push:
    branches: [master, main]

jobs:
  engine-quality:
    runs-on: ubuntu-latest
    # Nothing here opens a window, but the suite does reach the desktop package,
    # and there is no display on a runner if anything ever does.
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same libraries as the desktop workflow, and needed here for two separate
      # reasons. `uv sync --all-packages` puts pytest-qt in the shared
      # environment, and it imports PySide6 from `pytest_configure` on every run
      # whether or not a Qt test is collected; and the engine suite resolves the
      # `rotaris` entry point and drives the requirement board, both of which
      # reach the desktop package on purpose. PySide6 links libEGL/libGL even
      # under the offscreen platform plugin.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: uv sync --all-packages
      # `-n auto` is what makes the full suite affordable (measured 748s serial
      # against 147s across 16 workers). No `-x`: under xdist the first failure
      # kills every worker, so one flake would hide the rest of the run. The
      # per-test timeout has to clear the worst case under that contention,
      # which is well above the 30s a serial run needs.
      #
      # Capability tests are deselected rather than left to skip themselves:
      # they drive a real LLM endpoint, and CI has no credentials for one.
      - run: uv run pytest -q --timeout=120 -n auto -m "not capability"
      - run: uv run ruff check src/ tests/ --exclude 'tests/fixtures/files/large.py'
      - run: uv run mypy src/rotaris_core/
