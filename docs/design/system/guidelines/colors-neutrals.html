<!-- @dsCard group="Colors" viewport="700x190" name="Neutral ramp" subtitle="Ground, chrome and text — true neutral gray, never blue-black or sepia" -->
<link rel="stylesheet" href="../styles.css">
<div style="width:700px;padding:20px;background:var(--rt-bg);display:flex;gap:8px">
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:52px;border-radius:8px;background:var(--rt-bg);border:1px solid var(--rt-border)"></div><span class="mono text-dim" style="font-size:10px">bg</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:52px;border-radius:8px;background:var(--rt-surface)"></div><span class="mono text-dim" style="font-size:10px">surface</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:52px;border-radius:8px;background:var(--rt-surface-2)"></div><span class="mono text-dim" style="font-size:10px">surface-2</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:52px;border-radius:8px;background:var(--rt-chrome)"></div><span class="mono text-dim" style="font-size:10px">chrome</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:52px;border-radius:8px;background:var(--rt-hover)"></div><span class="mono text-dim" style="font-size:10px">hover</span></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:52px;border-radius:8px;background:var(--rt-surface);border:1px solid var(--rt-border-strong)"></div><span class="mono text-dim" style="font-size:10px">border-strong</span></div>
</div>
<div style="width:700px;padding:0 20px 20px;background:var(--rt-bg);display:flex;gap:18px">
<span style="color:var(--rt-text);font-size:13px">text</span>
<span style="color:var(--rt-text-secondary);font-size:13px">text-secondary</span>
<span style="color:var(--rt-text-tertiary);font-size:13px">text-tertiary</span>
<span style="color:var(--rt-text-disabled);font-size:13px">text-disabled</span>
</div>
