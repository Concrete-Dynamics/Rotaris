[project]
name = "rotaris-core"
version = "0.120.4"
description = "CLI-native agentic orchestration framework built on OpenHands SDK"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "openhands-sdk>=1.34.0,<1.38.0",
    "openhands-tools>=1.34.0,<1.38.0",
    "opentelemetry-instrumentation==0.60b1",
    "opentelemetry-instrumentation-threading==0.60b1",
    "opentelemetry-semantic-conventions==0.60b1",
    "litellm>=1.83.7,<2.0",
    "textual>=8.2.0,<9.0",
    "typer>=0.15.0",
    "pyyaml>=6.0",
    "xxhash>=3.5.0",
    "pydantic>=2.12.0,<3.0",
    "httpx>=0.27.0",
    "mcp>=1.0",
    "platformdirs>=4.0",
    "toml>=0.10.2",
    "claude-agent-sdk>=0.2.128",
]

[project.optional-dependencies]
# Claude Code subscription provider (SWR-777): requests run through the
# Claude Agent SDK's local runtime instead of LiteLLM.
claude-code = [
    "claude-agent-sdk>=0.1.0",
]

[dependency-groups]
dev = [
    # Build-time only (SWR-3001): freezes the standalone binaries, never imported
    # by shipped code — rotaris_core.packaging stays stdlib-only.
    "pyinstaller>=6.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
    # Load-bearing for `-n auto`, not a convenience. xdist resolves `auto` to
    # `psutil.cpu_count(logical=False)` when psutil imports and falls back to
    # `os.cpu_count()` when it does not — physical cores against logical ones,
    # a factor of two on any hyperthreaded box. It reaches the environment today
    # only as a runtime dependency of `apps/rotaris`, so a sync of this package
    # alone would silently double the worker count and halve the CPU each test
    # gets. Declared here so the engine suite's parallelism is its own business.
    "psutil>=6.0",
    "mypy>=1.15",
    "ruff>=0.11",
    "respx>=0.22",
    "textual-dev>=1.8",
    "pytest-textual-snapshot>=1.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
rotaris-cli = "rotaris_core.cli.app:main"
rotaris-headless = "rotaris_core.cli.argparse_app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Quarantined snapshot tests (docs/testing/flaky-quarantine.md) keep their
# recorded baseline while their body is empty, so syrupy sees a snapshot no
# test claims. That is a hygiene signal, not a failure: warn instead of
# failing the run, or every quarantine would also break the exit code.
#
# `--dist loadfile` gives each worker whole test files instead of individual
# tests. It is set here rather than in the Makefile because the command that
# matters is the one someone types by hand, and it buys two things at once.
# Speed: measured 323s against 399s, and 207s against 364s, on two separate
# back-to-back pairs of the full engine suite. Determinism: process-wide state
# — the prompt registry, the skill catalogue, the Textual theme, the sandbox
# probe caches — is then perturbed only by a file's own neighbours, in a fixed
# order, instead of by whichever tests from 550 files a scheduler happened to
# interleave on that worker on that run. `--dist load` is what made the same
# commit green once and red the next time with nothing changed in between.
addopts = "--snapshot-warn-unused --dist loadfile"
markers = [
    "capability: end-to-end capability tests against a real LLM (slow, requires model endpoint)",
    "unit: a focused unit in isolation; collaborators replaced where isolation is the point",
    "integration: real collaboration across modules, persistence, or a UI/service seam",
    "e2e: a productive flow driven through the real public product boundary, faking only external systems",
    "serial: needs real CPU headroom (drives concurrent runs and asserts on their interleaving); starves and fails under `-n auto`, so the parallel pass deselects it with `-m 'not serial'` and a second serial pass picks it up",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Deliberately malformed test fixtures (HAET drift/recovery cases).
extend-exclude = ["tests/fixtures/files"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Optional extra (rotaris-core[claude-code]); imported lazily at request time.
module = "claude_agent_sdk"
ignore_missing_imports = true

[tool.uv.workspace]
members = ["apps/rotaris"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
