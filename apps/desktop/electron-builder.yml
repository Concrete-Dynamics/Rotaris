# ADR-0054 / ADR-0056 — packaging. Windows only until IC-3 is discharged:
# the macOS and Linux targets are DELIBERATELY absent, not defaulted, because
# an artifact for a platform nobody has measured is shipping on an untested
# platform (implementation-conditions.md, IC-3).
#
# Artifact names come from tools/release-naming (REQ-STARTUP-031) and are
# composed nowhere else; the templates below must match `artifactName(v, 'setup')`.
# The portable is NOT the tool's `portable` target (refused, ADR-0054 P1); it is
# assembled by the release pipeline from win-unpacked around our own stub, later.
appId: dev.rotaris.desktop
productName: Rotaris
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  # ADR-0056 rule 1: prebuilt binaries are refused. Excluded from the artifact so each binding's own
  # loader falls through to the binary this build compiled (better-sqlite3 prefers prebuilds/ first;
  # node-pty prefers build/Release first — both are checked by the hooks, not assumed).
  # Each binding's package is reduced to its JavaScript and the binaries this build compiled: no
  # prebuild, no sources, no intermediate objects. Later patterns override earlier ones.
  - "!**/node_modules/better-sqlite3/{prebuilds,build,deps,src}/**"
  - "**/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
  - "!**/node_modules/node-pty/{prebuilds,build,deps,src,third_party,scripts}/**"
  - "**/node_modules/node-pty/build/Release/{pty,conpty,conpty_console_list}.node"
  - "**/node_modules/node-pty/build/Release/{winpty.dll,winpty-agent.exe}"
asarUnpack:
  # ADR-0058 consequence 1 / ADR-0056 rule 3: native bindings are unpacked, with the helper
  # binaries node-pty's winpty path executes beside them.
  - "**/*.node"
  - "**/node_modules/node-pty/build/Release/**"
publish: null
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: "Rotaris-${version}-windows-x64-setup.${ext}"
nsis:
  oneClick: true
  perMachine: false
  artifactName: "Rotaris-${version}-windows-x64-setup.${ext}"
# ADR-0056 rule 1: every native binding is rebuilt from source against the
# shipped Electron, configured explicitly even where it is the default.
npmRebuild: true
buildDependenciesFromSource: true
# ADR-0056 rule 1a: the rebuild's exit status is not evidence (defect D10). The
# hooks establish that a compiled binary exists, is newer than the rebuild step,
# is the file the artifact carries, and is the file the packaged Electron's
# loader opens (rule 4). A miss refuses the build. See scripts/build-hooks.cjs.
beforeBuild: ./scripts/build-hooks.cjs
afterPack: ./scripts/build-hooks.cjs
