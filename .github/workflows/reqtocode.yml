name: ReqToCode traceability

on:
  pull_request:
  push:
    # Milestone and epic integration branches get the same gate as master:
    # without it a long-lived branch has no ReqToCode signal between merges.
    branches: [master, main, "milestone/**", "epic/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stdlib-only: no dependency install needed (blueprint §7 build gate).
      - run: python -m rotaris_core.reqtocode check
        env:
          PYTHONPATH: src
