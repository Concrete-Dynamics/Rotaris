[project]
name = "rotaris"
# One product version (SWR-3002 AC-006): `rotaris` and `rotaris-core` release
# together under one tag, so this must stay in step with the root pyproject.
version = "0.120.3"
description = "Rotaris — desktop workspace for the Rotaris multi-agent orchestration framework"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mistune>=3.1,<4",
    "PySide6>=6.8,<6.9",
    "psutil>=6.0",
    "pyte>=0.8.2",
]

[project.optional-dependencies]
# Full backend integration (run real sessions from the desktop app).
backend = [
    "rotaris-core",
]

[dependency-groups]
# PEP 735 group (not an extra): installed by plain `uv sync --all-packages`,
# so the documented test command gets pytest-qt without `--all-extras`.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.0",
    # The documented desktop command is a parallel one, and `addopts` below
    # names a distribution mode, so xdist has to be this package's own
    # dependency rather than something the shared workspace environment happens
    # to supply.
    "pytest-xdist>=3.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "PyYAML>=6.0",
]

[project.scripts]
rotaris = "rotaris.main:main"
rotaris-benchmark = "rotaris.benchmark:main"

[tool.uv.sources]
rotaris-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
# Mirrors the root `addopts` for the same two reasons, and the Qt suite needs it
# more than the engine one does: the theme manager, `QSettings` and the
# `QApplication` itself are process-wide, and `test_theme_switching_flow.py`
# already documents in a fixture that a worker fed tests from many files lets
# one file's leftover theme decide another file's assertion.
addopts = "--dist loadfile"
# Mirrors the root marker list: CI runs `pytest apps/rotaris/tests` from the
# repository root, so that config applies there and this one applies when the
# suite is run from inside apps/rotaris.
markers = [
    "unit: a focused unit in isolation; collaborators replaced where isolation is the point",
    "integration: real collaboration across modules, persistence, or a UI/service seam",
    "e2e: a productive flow driven through the real public product boundary, faking only external systems",
    "serial: needs real CPU headroom (drives concurrent runs and asserts on their interleaving); starves and fails under `-n auto`, so the parallel pass deselects it with `-m 'not serial'` and a second serial pass picks it up",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Same rule set as the root pyproject: the desktop app is linted to the engine's
# standard, not a looser one.
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rotaris"]
