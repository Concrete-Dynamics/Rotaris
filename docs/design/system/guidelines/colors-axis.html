<!-- @dsCard group="Colors" viewport="700x232" name="Coordinate axes — X/Y/Z" subtitle="The brand's mathematical flair: three axis colors, spoken as the product's own agent states" -->
<link rel="stylesheet" href="../styles.css">
<div style="width:700px;padding:20px;background:var(--rt-bg);display:flex;flex-direction:column;gap:12px;font-family:var(--rt-font-body)">
<div style="display:flex;align-items:center;gap:14px">
<div style="width:64px;height:64px;border-radius:8px;background:var(--rt-axis-x-500);flex:none"></div>
<div><div style="font-size:14px;color:var(--rt-text);font-weight:500">X — waiting</div><div class="mono text-dim" style="font-size:10px">--rt-axis-x-500 · oklch(66% .145 86)</div></div>
<div style="flex:1"></div>
<div style="display:flex;gap:3px">
<div style="width:26px;height:26px;border-radius:4px;background:var(--rt-axis-x-300)"></div><div style="width:26px;height:26px;border-radius:4px;background:var(--rt-axis-x-500)"></div><div style="width:26px;height:26px;border-radius:4px;background:var(--rt-axis-x-700)"></div>
</div>
</div>
<div style="display:flex;align-items:center;gap:14px">
<div style="width:64px;height:64px;border-radius:8px;background:var(--rt-axis-y-500);flex:none"></div>
<div><div style="font-size:14px;color:var(--rt-text);font-weight:500">Y — running</div><div class="mono text-dim" style="font-size:10px">--rt-axis-y-500 · oklch(64% .140 165)</div></div>
<div style="flex:1"></div>
<div style="display:flex;gap:3px">
<div style="width:26px;height:26px;border-radius:4px;background:var(--rt-axis-y-300)"></div><div style="width:26px;height:26px;border-radius:4px;background:var(--rt-axis-y-500)"></div><div style="width:26px;height:26px;border-radius:4px;background:var(--rt-axis-y-700)"></div>
</div>
</div>
<div style="display:flex;align-items:center;gap:14px">
<div style="width:64px;height:64px;border-radius:8px;background:var(--rt-axis-z-500);flex:none"></div>
<div><div style="font-size:14px;color:var(--rt-text);font-weight:500">Z — done</div><div class="mono text-dim" style="font-size:10px">--rt-axis-z-500 = --rt-accent-500 · oklch(59% .160 292)</div></div>
<div style="flex:1"></div>
<div style="display:flex;gap:3px">
<div style="width:26px;height:26px;border-radius:4px;background:var(--rt-axis-z-100)"></div><div style="width:26px;height:26px;border-radius:4px;background:var(--rt-axis-z-500)"></div><div style="width:26px;height:26px;border-radius:4px;background:var(--rt-axis-z-800)"></div>
</div>
</div>
</div>
