<!-- @dsCard group="Colors" viewport="700x150" name="Exceptional semantics" subtitle="Danger and info sit outside the three-axis system — used sparingly, for real exceptions" -->
<link rel="stylesheet" href="../styles.css">
<div style="width:700px;padding:20px;background:var(--rt-bg);display:flex;gap:28px">
<div style="display:flex;align-items:center;gap:12px"><div style="width:46px;height:46px;border-radius:8px;background:var(--rt-danger-500)"></div><div><div style="font-size:13px;color:var(--rt-text)">Danger / failed</div><div class="mono text-dim" style="font-size:10.5px">--rt-danger-500</div></div></div>
<div style="display:flex;align-items:center;gap:12px"><div style="width:46px;height:46px;border-radius:8px;background:var(--rt-info-500)"></div><div><div style="font-size:13px;color:var(--rt-text)">Info</div><div class="mono text-dim" style="font-size:10.5px">--rt-info-500</div></div></div>
</div>
