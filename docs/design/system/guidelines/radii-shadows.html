<link rel="stylesheet" href="../styles.css">
<div style="width:700px;padding:20px;background:var(--rt-bg);display:flex;gap:20px;align-items:center">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;background:var(--rt-surface-2);border-radius:var(--rt-radius-sm)"></div><span class="mono text-dim" style="font-size:10px">sm 5</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;background:var(--rt-surface-2);border-radius:var(--rt-radius-md)"></div><span class="mono text-dim" style="font-size:10px">md 8</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;background:var(--rt-surface-2);border-radius:var(--rt-radius-lg)"></div><span class="mono text-dim" style="font-size:10px">lg 14</span></div>

<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:70px;height:56px;background:var(--rt-surface-2);border-radius:8px;box-shadow:var(--rt-shadow-md)"></div><span class="mono text-dim" style="font-size:10px">shadow-md</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:70px;height:56px;background:var(--rt-surface-2);border-radius:8px;box-shadow:var(--rt-shadow-lg)"></div><span class="mono text-dim" style="font-size:10px">shadow-lg</span></div>
</div>
