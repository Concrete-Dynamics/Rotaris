# Prompt composition matrix — persona x intent x model tier.
#
# Design authority: docs/architecture/prompt-composition-matrix.md (SWR-2416).
#
# Resolution order for a persona's intent key:
#   1. the concrete intent name (e.g. `small_feature`)
#   2. the group that contains the intent (see `groups` below)
#   3. `_default`
# Resolution order for the tier key inside a matched intent entry:
#   1. the concrete tier (`small_model` / `medium_model` / `large_model`)
#   2. `_all`
#
# A cell is either a mapping of SLOT -> variant id, or `not_routed: true`.
# Slots omitted from a cell fall back to the persona's `defaults` mapping.
# Variant texts live in `variants.yaml`.

# Intent -> persona that actually performs the implementation. The orchestrator's
# matrix row is keyed on THIS persona's model tier, not on its own.
owners:
  refactor: refactorer
  requirements: requirements-engineer
  architectural: architect
  _default: coding-agent

groups:
  G-answer: [question, exploration]
  G-clarify: [ambiguous, requirements]
  G-micro: [explicit_trivial, single_file_change]
  G-fix: [problem_resolution, refactor]
  G-build-s: [small_feature]
  G-build-m: [moderate_feature]
  G-build-l: [large_feature, architectural, whole_project]

personas:
  # ── orchestrator ─────────────────────────────────────────────────────────
  # Axis = implementation-owner tier (see `owners`).
  orchestrator:
    defaults:
      AUTONOMY: full
      ARTIFACT: read-required
      OUTPUT: structured
    intents:
      explicit_trivial:
        _all:
          ROUTE: direct
          RESEARCH: self
          CHUNKING: micro-slice
          VERIFY: self
          BUDGET: tight
      single_file_change:
        _all:
          ROUTE: direct
          RESEARCH: self
          CHUNKING: micro-slice
          VERIFY: self
          BUDGET: tight
      question:
        _all:
          ROUTE: answer-only
          RESEARCH: delegate-required
          CHUNKING: "n/a"
          VERIFY: none
          BUDGET: tight
      exploration:
