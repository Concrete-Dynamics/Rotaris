# Dependabot version updates (R-091; docs/architecture/hardening.md §3.5 row 9).
#
# A Dependabot pull request is a branch like any other and lands by this
# repository's workflow (docs/clean-room/agent-workflow.md): rebased onto
# origin/main, `pnpm check` green on the rebased head, the proofs
# `pnpm verify:plan` names, then a fast-forward push to main, by
# `pnpm worktree:land` or an orchestrated build's reviewer. Never the merge
# button: main's history is linear, and a merge commit or a squash made by
# GitHub lands a head no gate judged.
#
# Security alerts are not this file's: their triage record stays
# docs/architecture/dependency-alerts/, one dated reading per pass.
#
# tools/dependabot.test.ts holds the ecosystems, the cooldown, the groups and
# the ignore list.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Seven days, the release-age window pnpm-workspace.yaml sets
    # (minimumReleaseAge: 10080 minutes): a version Dependabot proposes is old
    # enough for `pnpm install` to resolve it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore(deps)
    # A version a pull request has been closed on is not re-proposed weekly. An
    # entry names what is refused, the evidence that refused it, and the
    # condition that lifts it — never a preference. `tools/dependabot.test.ts`
    # holds the list, so an entry cannot be added or removed silently.
    ignore:
      # The product's own code builds an `undici` `Agent` and hands it to `fetch`
      # as the `dispatcher` (packages/agent-tools/src/tools/direct-fetch.ts,
      # OQ-37). Under 8.12.3 the gate measured the real refusal
      # `InvalidArgumentError: invalid onRequestStart method`
      # (undici/lib/core/util.js:597) plus five `fetch.test.ts` cases reading
      # `network_error` where `http_error`/`egress_redirect_denied` is expected
      # (job 126841519958, head 24ad497a, 2026-11-04). The `Dispatcher`
      # contract this code is written against is 7's, not 8's, so the bump is
      # incompatible with the product as built rather than unverified — the
      # reason #54 is closed and this entry stops the weekly re-proposal.
      # Re-evaluate when the dispatcher use is rewritten for 8's contract, in a
      # branch of its own, with direct-fetch and fetch suites green under 8:
      # then delete this entry. See
      # docs/architecture/dependency-alerts/2026-11-06-lane-electron-45-1.md §5.
      - dependency-name: 'undici'
        update-types: ['version-update:semver-major']
    # A dependency joins the first group whose pattern matches it, so the
    # catch-all `production` comes last.
    groups:
      # Electron, its packager and its build tool move together.
      electron:
        patterns:
          - electron
          - electron-builder
          - electron-vite
      dev-tooling:
        patterns:
          - eslint*
          - typescript*
          - vitest*
          # vitest's own scoped packages (its coverage provider) peer on its
          # exact version, so they move with it in one pull request.
          - '@vitest/*'
          - '@types/*'
      production:
        patterns:
          - '*'

  # Every action in .github/workflows/ is pinned by commit SHA with its version
  # in a trailing comment; Dependabot moves the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
