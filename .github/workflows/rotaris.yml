name: Rotaris desktop

on:
  pull_request:
    paths:
      - "apps/rotaris/**"
      - "src/rotaris_core/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/rotaris.yml"
  push:
    branches: [master, main]

jobs:
  desktop-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PySide6 links libEGL/libGL even under the offscreen platform plugin.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      # Rotaris test deps (pytest-qt etc.) live in its PEP 735 dev dependency
      # group, which plain --all-packages syncs by default.
      - run: uv sync --all-packages
      # Two passes, the same split the Makefile's `test-rotaris` target uses: the
      # Qt suite parallelises, and the handful of `serial` tests drive concurrent
      # runs and assert on their interleaving, so they need a core to themselves.
      # `--dist loadfile` comes from the package's own `addopts`, which is where
      # the reasoning lives -- the theme manager and `QSettings` are process-wide
      # and do not survive a worker fed tests from many files at once.
      # The timeout has to clear the worst case under that contention, well above
      # what a single-process run needs. Runner core counts differ from a
      # developer box; treat any wall time here as its own number.
      - run: uv run pytest apps/rotaris/tests -q --timeout=120 -p no:textual-snapshot -n auto -m "not serial"
      - run: uv run pytest apps/rotaris/tests -q --timeout=120 -p no:textual-snapshot -m serial
      - run: uv run ruff check apps/rotaris/src apps/rotaris/tests
      - run: uv run mypy apps/rotaris/src/rotaris
